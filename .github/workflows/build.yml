name: Build and Release Windows Agent

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows EXE
        run: |
          # Кросс-компиляция в чистый EXE
          GOOS=windows GOARCH=amd64 go build -o hostpulse_agent.exe main.go

      - name: Release Latest Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          files: hostpulse_agent.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
